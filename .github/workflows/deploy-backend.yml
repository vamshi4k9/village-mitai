name: 🚀 Deploy Backend (Django + Gunicorn)

on:
  push:
    branches: [main]
    paths:
      - 'Backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: 🔁 SSH into VPS and deploy backend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # stop at the first failing step, so a failed migration never
            # restarts the site with code the database is not ready for
            set -e

            echo "📦 Pulling latest code"
            cd /opt/villagemitai/Backend
            git pull origin main

            echo "🐍 Activating virtualenv"
            source venv/bin/activate
            
            echo "📦 Installing dependencies"
            pip install -r requirements.txt
            cd /opt/villagemitai/Backend/restaurant


            python manage.py makemigrations

            echo "📂 Running migrations"
            # like migrate, but skips changes already in the database (MySQL
            # keeps half of a migration that failed part way)
            python manage.py migrate_safe

            echo "🧹 Collecting static files"
            python manage.py collectstatic --noinput

            echo "🔁 Restarting Gunicorn service"
            sudo systemctl restart gunicorn-villagemitai

            echo "✅ Backend deployed successfully"
